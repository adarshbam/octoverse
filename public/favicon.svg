  <ellipse cx="23" cy="33" rx="4.5" ry="5.5" fill="#0f172a" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="21.5" cy="31.5" r="1.8" fill="#ffffff"/>
  <circle cx="24.5" cy="34.5" r="0.8" fill="#ffffff"/>
