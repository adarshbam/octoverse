  <path d="M 14 44 Q 8 56 18 58 Q 24 58 22 50" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <path d="M 50 44 Q 56 56 46 58 Q 40 58 42 50" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <path d="M 28 48 Q 26 60 32 60 Q 38 60 36 48" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="20" cy="39" rx="3.5" ry="2" fill="#fb7185" opacity="0.8"/>
  <ellipse cx="44" cy="39" rx="3.5" ry="2" fill="#fb7185" opacity="0.8"/>
